spring:
  application:
    name: fonja

  datasource:
    # allowPublicKeyRetrieval: MySQL 8 uses caching_sha2_password, which needs the
    # server's RSA public key to complete a first authentication without TLS.
    # Supplied by the deployment environment. In Compose this points to MySQL
    # over the private network; outside Compose it should use the managed DB URL.
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # schema owned by Flyway, not Hibernate
    show-sql: false
    open-in-view: false    # no lazy loading in the view layer; services return DTOs

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Verification documents are IDs and scans, not video.
      max-file-size: 10MB
      max-request-size: 12MB

  security:
    oauth2:
      client:
        registration:
          google:
            # Required from the deployment environment because Spring Boot
            # rejects an empty client id during bean creation.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
        # Apple is deliberately absent: its client secret is a JWT that expires
        # (six months maximum), so adding it means adding secret generation and
        # rotation, not just a client id. Google is the Day 1 provider.

fonja:
  auth:
    # No default — the app refuses to start without it, on purpose. A fallback
    # here would ship a signing key that is public in the repository.
    jwt-secret: ${FONJA_AUTH_JWT_SECRET:}
    jwt-ttl-seconds: ${FONJA_AUTH_JWT_TTL_SECONDS:43200}
    jwt-issuer: fonja
    # Unset: the login handler returns the token as JSON so the flow can be
    # tested before a frontend exists. Set this to the frontend callback and it
    # redirects with ?token=... instead.
    # login-success-redirect-uri: ${FONJA_AUTH_LOGIN_REDIRECT_URI:}

  ledger:
    # Fonja's cut of every donation, and the flat fee on every withdrawal. Changing either affects
    # only entries written afterwards — the ledger is append-only, so historical rows keep the split
    # they were written with.
    platform-fee-percent: ${FONJA_LEDGER_PLATFORM_FEE_PERCENT:7.00}
    withdrawal-fee: ${FONJA_LEDGER_WITHDRAWAL_FEE:200.00}

  notification:
    # Outbound email over SMTP. All three of host, username and password must be set or sending
    # is disabled and every notification is logged as SKIPPED — the app still starts. Gmail:
    # smtp.gmail.com:587, the account's address as username, and an App Password (not the login
    # password; needs 2-step verification on the account).
    smtp-host: ${FONJA_SMTP_HOST:}
    smtp-port: ${FONJA_SMTP_PORT:587}
    smtp-username: ${FONJA_SMTP_USERNAME:}
    smtp-password: ${FONJA_SMTP_PASSWORD:}
    # Gmail rewrites From to the account address unless it is a verified alias; leave blank to
    # use the username.
    from-address: ${FONJA_SMTP_FROM_ADDRESS:}
    from-name: ${FONJA_SMTP_FROM_NAME:Fonja}
    # The frontend's public URL, for the links inside each email. Blank means no links.
    app-base-url: ${FONJA_APP_BASE_URL:}

  cyberpay:
    base-url: ${CYBERPAY_BASE_URL}
    # Also the webhook signing key — CyberPay HMAC-SHA512s each notification with it. No default:
    # a blank key would "verify" signatures anyone could compute, so the webhook rejects every
    # request (503) until this is set, and logs why.
    integration-key: ${CYBERPAY_INTEGRATION_KEY:}
    api-key: ${CYBERPAY_API_KEY:}
    # Sent with every payment, so each environment notifies itself. Must be reachable from the
    # public internet — in development that means a tunnel, since CyberPay cannot post to
    # localhost. Without one, checkout still works and the donation simply stays PENDING.
    webhook-url: ${CYBERPAY_WEBHOOK_URL}
    # Where the donor's browser lands after checkout. Must already contain a query string:
    # CyberPay appends "&status=Completed" rather than "?status=Completed", so a bare path comes
    # back as ".../donation-complete&status=Completed" — one URL, no query, and the page 404s.
    return-url: ${CYBERPAY_RETURN_URL}
    connect-timeout: ${CYBERPAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${CYBERPAY_READ_TIMEOUT:15s}

  payout:
    # CyberPay's PayOut API is a separate service from the one that takes donations — a different
    # host entirely, not another path. Collections is payment-api.staging.cyberpay.ng; payouts are
    # on stagingserv.cyberpay.ng/payoutserv, which CyberPay give you directly. Their Postman
    # collection writes every payout call as {{PAYOUT_BASE_URL}}/... and the token call as
    # {{AUTHORIZATION_URL}}/oauth2/token, but declares neither variable, so both have to be asked
    # for. Auth is OAuth2 client_credentials — a bearer token from the authorization server — not
    # the ApiKey header collections uses.
    #
    # Blank means automatic disbursement is off. Withdrawals still work: the ledger reserves the
    # money when a creator asks, the payout sits REQUESTED, and an admin settles it through
    # POST /api/v1/payouts/admin/{id}/paid. Nothing is lost by leaving this unset.
    base-url: ${CYBERPAY_PAYOUT_BASE_URL:}
    authorization-url: ${CYBERPAY_PAYOUT_AUTH_URL:}
    client-id: ${CYBERPAY_PAYOUT_CLIENT_ID:}
    client-secret: ${CYBERPAY_PAYOUT_CLIENT_SECRET:}
    # The wallet payouts are debited from. An opaque GUID from CyberPay — and note it is still an
    # open question whether this is the same pot donations settle into. Ask them before going live.
    wallet-code: ${CYBERPAY_PAYOUT_WALLET_CODE:}
    wallet-type: ${CYBERPAY_PAYOUT_WALLET_TYPE:Business}
    # What shows on the creator's bank statement. Nigerian banks truncate hard — keep it short.
    sender-name: ${FONJA_PAYOUT_SENDER_NAME:FONJA}
    # Payouts above this are left for an admin instead of going out automatically, so a bug drains
    # the wallet one small instruction at a time rather than all at once. 0 removes the ceiling.
    max-automatic-amount: ${FONJA_PAYOUT_MAX_AUTOMATIC:200000.00}
    connect-timeout: ${CYBERPAY_PAYOUT_CONNECT_TIMEOUT:5s}
    # Longer than the collections timeout on purpose: a transfer instruction cannot be safely
    # retried, so waiting for an answer beats giving up and not knowing whether it was accepted.
    read-timeout: ${CYBERPAY_PAYOUT_READ_TIMEOUT:30s}

  storage:
    local:
      # Placeholder implementation. Local disk is not durable across container
      # restarts and is not shared between instances — must move to object storage
      # before any multi-instance deployment. See technical spec §6.
      base-path: ${STORAGE_LOCAL_BASE_PATH}

logging:
  level:
    # Dumps each CyberPay notification exactly as it arrived, before the signature is checked —
    # the only way to see a body whose signature did not match. Off by default: the payload of a
    # bank transfer carries the donor's account number, so this is a development switch only.
    #   FONJA_LOG_WEBHOOK=DEBUG ./mvnw spring-boot:run
    com.fonja.donation.controller.DonationWebhookController: ${FONJA_LOG_WEBHOOK:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
