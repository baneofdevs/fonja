services:
  mysql:
    image: mysql:8.0
    container_name: fonja-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      # Bind only to localhost so host-run Maven can reach the development
      # database without exposing MySQL to the network.
      - "127.0.0.1:${MYSQL_HOST_PORT:?set MYSQL_HOST_PORT in .env}:3306"
    volumes:
      - fonja-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fonja-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # allowPublicKeyRetrieval is required because MySQL 8 authenticates with
      # caching_sha2_password: on a TLS-less connection the client must fetch the
      # server's RSA public key to encrypt the password, and Connector/J refuses
      # to do that unless asked. Safe here — the app and MySQL share a private
      # compose network. In production, enable TLS (sslMode=REQUIRED) instead of
      # carrying this flag forward; over an untrusted network it is MITM-able.
      # Compose uses its service DNS name; host-run Maven uses SPRING_DATASOURCE_URL.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fonja?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      # Signing key for the internal JWT. No default on purpose — compose fails
      # loudly rather than starting the app with a guessable key.
      FONJA_AUTH_JWT_SECRET: ${FONJA_AUTH_JWT_SECRET:?set FONJA_AUTH_JWT_SECRET in .env — see .env.example}
      # Required here so Compose fails before creating containers when a
      # production credential is missing.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      CYBERPAY_BASE_URL: ${CYBERPAY_BASE_URL:?set CYBERPAY_BASE_URL in .env}
      CYBERPAY_INTEGRATION_KEY: ${CYBERPAY_INTEGRATION_KEY:?set CYBERPAY_INTEGRATION_KEY in .env}
      CYBERPAY_API_KEY: ${CYBERPAY_API_KEY:?set CYBERPAY_API_KEY in .env}
      CYBERPAY_WEBHOOK_URL: ${CYBERPAY_WEBHOOK_URL:?set CYBERPAY_WEBHOOK_URL in .env}
      CYBERPAY_RETURN_URL: ${CYBERPAY_RETURN_URL:?set CYBERPAY_RETURN_URL in .env}
      # CyberPay PayOut. Optional, unlike the collections values above: blank switches automatic
      # disbursement off and withdrawals wait for an admin, so a missing value is safe rather than
      # fatal. `:-` rather than `:?` for that reason.
      CYBERPAY_PAYOUT_BASE_URL: ${CYBERPAY_PAYOUT_BASE_URL:-}
      CYBERPAY_PAYOUT_AUTH_URL: ${CYBERPAY_PAYOUT_AUTH_URL:-}
      CYBERPAY_PAYOUT_CLIENT_ID: ${CYBERPAY_PAYOUT_CLIENT_ID:-}
      CYBERPAY_PAYOUT_CLIENT_SECRET: ${CYBERPAY_PAYOUT_CLIENT_SECRET:-}
      CYBERPAY_PAYOUT_WALLET_CODE: ${CYBERPAY_PAYOUT_WALLET_CODE:-}
      # FONJA_AUTH_LOGIN_REDIRECT_URI: ${FONJA_AUTH_LOGIN_REDIRECT_URI:?set FONJA_AUTH_LOGIN_REDIRECT_URI in .env}
      STORAGE_LOCAL_BASE_PATH: ${STORAGE_LOCAL_BASE_PATH:?set STORAGE_LOCAL_BASE_PATH in .env}
    ports:
      - "${APP_HOST_PORT:?set APP_HOST_PORT in .env}:8080"
    volumes:
      # Local filesystem storage for verification/evidence documents (see StorageService).
      # NOTE: this volume is single-host only — must migrate to Azure Blob before
      # any multi-instance deployment. See technical spec, Open Decisions.
      - fonja-documents:/data/fonja-documents

volumes:
  fonja-mysql-data:
  fonja-documents:
