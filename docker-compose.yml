services:
  mysql:
    image: mysql:8.0
    container_name: fonja-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fonja
      MYSQL_USER: fonja
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    ports:
      # Host port is configurable: a developer with a system MySQL already on
      # 3306 sets MYSQL_HOST_PORT rather than stopping it. The app container
      # always reaches MySQL on 3306 over the compose network regardless.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - fonja-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fonja-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: fonja
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # allowPublicKeyRetrieval is required because MySQL 8 authenticates with
      # caching_sha2_password: on a TLS-less connection the client must fetch the
      # server's RSA public key to encrypt the password, and Connector/J refuses
      # to do that unless asked. Safe here — the app and MySQL share a private
      # compose network. In production, enable TLS (sslMode=REQUIRED) instead of
      # carrying this flag forward; over an untrusted network it is MITM-able.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fonja?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      # Signing key for the internal JWT. No default on purpose — compose fails
      # loudly rather than starting the app with a guessable key.
      FONJA_AUTH_JWT_SECRET: ${FONJA_AUTH_JWT_SECRET:?set FONJA_AUTH_JWT_SECRET in .env — see .env.example}
      # The fallback must be repeated here, not just in application.yml: compose
      # would otherwise pass these through as empty strings, and an empty env var
      # beats a YAML default. Spring Boot rejects an empty client id outright, so
      # that combination stops the app booting. `:-` covers unset and empty alike.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-not-configured}
      # TODO (Day 3): CyberPay base URL / credentials
      STORAGE_LOCAL_BASE_PATH: /data/fonja-documents
    ports:
      - "8080:8080"
    volumes:
      # Local filesystem storage for verification/evidence documents (see StorageService).
      # NOTE: this volume is single-host only — must migrate to Azure Blob before
      # any multi-instance deployment. See technical spec, Open Decisions.
      - fonja-documents:/data/fonja-documents

volumes:
  fonja-mysql-data:
  fonja-documents:
